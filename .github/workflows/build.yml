name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bittumama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bittumama_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bittumama_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma schema validation
        run: npm run prisma:validate

      - name: Apply Prisma migrations
        run: npm run prisma:deploy

      - name: Seed canonical Services
        run: npm run prisma:seed

      - name: Verify canonical Services
        run: npm run services:verify

      - name: Seed canonical Research\n        run: npm run research:seed\n\n      - name: Verify canonical Research\n        run: npm run research:verify\n\n      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
