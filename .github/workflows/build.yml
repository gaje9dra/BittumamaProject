name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bittumama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bittumama_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bittumama_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma schema validation
        run: npm run prisma:validate

      - name: Apply Prisma migrations
        run: npm run prisma:deploy

      - name: Seed canonical Services
        run: npm run prisma:seed

      - name: Verify canonical Services
        run: npm run services:verify

      - name: Seed canonical Research
        run: npm run research:seed

      - name: Verify canonical Research
        run: npm run research:verify

      - name: Seed canonical Experts
        run: npm run experts:seed

      - name: Verify canonical Experts
        run: npm run experts:verify

      - name: Seed canonical Articles
        run: npm run articles:seed

      - name: Verify canonical Articles
        run: npm run articles:verify

      - name: Seed canonical Workshops/Events
        run: npm run events:seed

      - name: Verify canonical Workshops/Events
        run: npm run events:verify

      - name: Verify cross-content relationships
        run: npm run content:verify

      - name: Verify event registrations
        run: npm run registrations:verify

      - name: Verify payment infrastructure
        run: npm run payments:verify

      - name: Verify notifications
        run: npm run notifications:verify

      - name: Verify authentication
        run: npm run auth:verify

      - name: Verify analytics
        run: npm run analytics:verify

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Start production server
        env:
          AUTH_SECRET: test-location-pages-secret
          AUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/bittumama-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/locations/new-york > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bittumama-next.log
          exit 1

      - name: Verify all Service routes and dropdown destinations
        env:
          AUTH_SECRET: test-service-routes-secret
          AUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run services:routes:verify

      - name: Verify all location routes
        env:
          AUTH_SECRET: test-location-pages-secret
          AUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm exec tsx scripts/verify-locations.ts
